name: Build OpenList NVENC worker image

on:
  workflow_dispatch:
    inputs:
      openlist_ref:
        description: OpenList tag or commit to build from
        required: true
        default: v4.2.9
        type: string
      image_namespace:
        description: GHCR user or organization that owns the image
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-image.yml
      - README.md
      - config/**
      - scripts/**
      - web/**
      - entrypoint.py
      - compose.worker.example.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      OPENLIST_REF: ${{ inputs.openlist_ref || 'v4.2.9' }}
      IMAGE_NAMESPACE: ${{ inputs.image_namespace || vars.IMAGE_NAMESPACE }}
      IMAGE_NAME: ghcr.io/${{ inputs.image_namespace || vars.IMAGE_NAMESPACE }}/openlist-transcode-worker
    steps:
      - name: Checkout worker project
        uses: actions/checkout@v4

      - name: Validate image namespace
        env:
          IMAGE_NAMESPACE: ${{ inputs.image_namespace || vars.IMAGE_NAMESPACE }}
        run: |
          if [ -z "${IMAGE_NAMESPACE}" ]; then
            echo "Repository variable IMAGE_NAMESPACE is required." >&2
            exit 1
          fi
          case "${IMAGE_NAMESPACE}" in
            *[!A-Za-z0-9._-]*)
              echo "IMAGE_NAMESPACE contains characters invalid for an OCI image name." >&2
              exit 1
              ;;
          esac

      - name: Checkout OpenList source at requested ref
        uses: actions/checkout@v4
        with:
          repository: OpenListTeam/OpenList
          ref: ${{ inputs.openlist_ref || 'v4.2.9' }}
          path: upstream
          fetch-depth: 1

      - name: Record upstream revision
        run: |
          echo "OpenList ref: ${OPENLIST_REF}"
          git -C upstream rev-parse HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Build official worker binary
        working-directory: upstream
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o ../openlist-transcode-worker ./cmd/worker
          file ../openlist-transcode-worker

      - name: Check public build context for private data
        run: |
          ! git grep -n -I -E '(^|[^0-9])192\.168\.|(^|[^0-9])10\.[0-9]{1,3}\.|(^|[^0-9])172\.(1[6-9]|2[0-9]|3[0-1])\.|127\.0\.0\.1|gho_|github_pat_|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|/(Users|home|mnt)/' -- . ':!.github'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.OPENLIST_REF }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
